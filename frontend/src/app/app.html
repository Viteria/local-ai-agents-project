
<div class="page">
  <header class="header">
    <div class="logo">✦</div>
    <div>
      <h2>English Learning Companion</h2>
      <p>Your AI-powered vocabulary assistant</p>
    </div>
  </header>

  <main class="card">
    <h1>Import your lesson</h1>
    <p class="description">
      Paste your lesson HTML below to extract
      useful vocabulary and expressions.
    </p>

    <label for="lesson">Lesson content</label>
    <textarea
      id="lesson"
      placeholder="Paste your HTML or lesson text here..."
      [value]="lessonHtml()" (input)="lessonHtml.set($any($event.target).value)"
    ></textarea>
    <p>Characters: {{ lessonHtml().length }}</p>

    <div class="actions">
      <span class="hint">✧ Processed locally</span>
      <div>
        <button (click)="lessonHtml.set('')" >Clear</button>
        <button type="button" (click)="extractVocabulary()" [disabled]="isLoading()"  >
          @if (isLoading()) {
            <span class="spinner"></span>Extracting vocabulary
          } @else{
            ✦ Extract vocabulary
          }</button>
      </div>

    </div>
  </main>

  <footer>Powered by Ollama · OpenAI Agents SDK</footer>
</div>
